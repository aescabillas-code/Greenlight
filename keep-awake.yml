name: Keep Greenlight awake

# Streamlit Community Cloud puts an app to sleep after about 12 hours without visitors.
# This job opens the app in a real browser every 6 hours (a plain HTTP ping does not count),
# and presses "Yes, get this app back up!" if the app has already gone to sleep.
#
# Setup: in the GitHub repo go to Settings > Secrets and variables > Actions > Variables
# and add APP_URL with your app address, e.g. https://your-greenlight.streamlit.app

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Visit the app
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          python - <<'PY'
          import os, sys, time
          from playwright.sync_api import sync_playwright

          url = os.environ.get("APP_URL", "").strip()
          if not url:
              sys.exit("APP_URL is not set. Add it under Settings > Secrets and variables > Actions > Variables.")

          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              page.goto(url, wait_until="domcontentloaded", timeout=90000)
              time.sleep(8)

              wake = page.get_by_role("button", name="Yes, get this app back up!")
              if wake.count():
                  print("App was asleep, waking it up")
                  wake.first.click()
                  time.sleep(45)

              # Streamlit renders the app inside the page; give the websocket time to connect.
              time.sleep(20)
              asleep = page.get_by_text("This app has gone to sleep").count()
              browser.close()
              if asleep:
                  sys.exit("App is still asleep")
              print("App is awake")
          PY
