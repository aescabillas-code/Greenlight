<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>window.GREENLIGHT_MODE="streamlit";</script>
<style>img{max-width:100%}[hidden]{display:none!important}</style>
<title>Greenlight</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script async src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: slim sticky bar with tabs, one working column that splits in two on wide screens; the month calendar is the centre of every view. */
:root{
  --bg:#F2F6F4; --surface:#FFFFFF; --surface-2:#E9F0ED; --line:#D3DEDA; --fg:#16231F; --muted:#566A64;
  --accent:#01A982; --accent-ink:#00785E; --accent-soft:#DCF3EB; --btn:#00805F; --on-btn:#FFFFFF; --ok-bg:#00805F; --ok-fg:#FFFFFF; --pick-bg:#6A2FE0; --pick-fg:#FFFFFF; --btn2:#007A7C; --teal:#00BFB0; --rg1:#00805F; --rg2:#0B6FB8; --rg3:#B8540A; --rg4:#B0257A;
  --danger:#B43B38; --danger-soft:#FBE8E7; --warn:#8A5600; --warn-soft:#FFF0D2; --violet:#6427D6; --violet-soft:#EEE7FC;
  --glass:rgba(255,255,255,.60); --glass-line:rgba(255,255,255,.75); --overlay:rgba(10,44,35,.34); --shadow:0 28px 70px rgba(8,44,34,.24);
  --display:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1513; --surface:#17211F; --surface-2:#202C29; --line:#30413C; --fg:#E8F1EE; --muted:#9BB0A9;
  --accent:#17C79B; --accent-ink:#52E2BC; --accent-soft:#12382F; --btn:#17C79B; --on-btn:#04231B; --ok-bg:#008A68; --ok-fg:#FFFFFF; --pick-bg:#7A48F2; --pick-fg:#FFFFFF; --btn2:#32DAC8; --teal:#32DAC8; --rg1:#3FD9AE; --rg2:#6DB8F5; --rg3:#FFA95C; --rg4:#F08CC8;
  --danger:#FF7D78; --danger-soft:#3A2020; --warn:#FFC45C; --warn-soft:#3A2E14; --violet:#B89CFF; --violet-soft:#2B2346;
  --glass:rgba(24,36,33,.58); --glass-line:rgba(255,255,255,.14); --overlay:rgba(1,10,8,.58); --shadow:0 28px 70px rgba(0,0,0,.55);
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0E1513; --surface:#17211F; --surface-2:#202C29; --line:#30413C; --fg:#E8F1EE; --muted:#9BB0A9;
  --accent:#17C79B; --accent-ink:#52E2BC; --accent-soft:#12382F; --btn:#17C79B; --on-btn:#04231B; --ok-bg:#008A68; --ok-fg:#FFFFFF; --pick-bg:#7A48F2; --pick-fg:#FFFFFF; --btn2:#32DAC8; --teal:#32DAC8; --rg1:#3FD9AE; --rg2:#6DB8F5; --rg3:#FFA95C; --rg4:#F08CC8;
  --danger:#FF7D78; --danger-soft:#3A2020; --warn:#FFC45C; --warn-soft:#3A2E14; --violet:#B89CFF; --violet-soft:#2B2346;
  --glass:rgba(24,36,33,.58); --glass-line:rgba(255,255,255,.14); --overlay:rgba(1,10,8,.58); --shadow:0 28px 70px rgba(0,0,0,.55);
  color-scheme:dark }

*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:19px} h3{font-size:15px}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.tn{font-variant-numeric:tabular-nums}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in,.shell{max-width:1180px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{display:flex;align-items:center;gap:8px 20px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.mark{width:22px;height:22px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.name{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.02em}
.tag{color:var(--muted);font-size:13px}
#nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;min-width:0}
#nav::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:8px 12px;border-radius:9px;cursor:pointer;color:var(--muted);font-weight:600;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tab:hover{color:var(--fg);background:var(--surface-2)}
.tab.on{color:var(--accent-ink);background:var(--accent-soft)}
.badge{background:var(--warn-soft);color:var(--warn);border-radius:999px;font-size:11px;padding:1px 7px;font-weight:700}
#who{display:flex;align-items:center;gap:8px}
@media (max-width:760px){ #nav{order:3;width:100%} .tag{display:none} }

.shell{padding-block:20px 56px;display:flex;flex-direction:column;gap:18px}
.demo{background:var(--violet-soft);color:var(--violet);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:500}
.demo b{font-weight:700}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 16px}
.head h1{font-size:26px}
.head p{color:var(--muted);max-width:62ch}
.cols{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){ .cols{grid-template-columns:minmax(0,1fr)} }
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.step{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-ink);font-weight:700}
.muted{color:var(--muted)} .small{font-size:13px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.grow{flex:1 1 auto;min-width:0}
.empty{color:var(--muted);text-align:center;padding:36px 12px;border:1px dashed var(--line);border-radius:12px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--btn);border-color:var(--btn);color:var(--on-btn)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:var(--surface)}
.btn.violet{background:var(--violet);border-color:var(--violet);color:var(--surface)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
body.busy .btn.primary{opacity:.6;pointer-events:none}
.icon{width:34px;padding:6px 0;text-align:center}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:12px;font-weight:600;color:var(--muted)}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;min-width:0}
textarea.input{min-height:84px;resize:vertical}
.input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--muted);font-size:13px;display:flex;gap:6px;align-items:center}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg .c{font-size:11px;opacity:.75}

.results{display:flex;flex-direction:column;gap:2px;max-height:260px;overflow:auto}
.results button{border:0;background:none;text-align:left;padding:8px 10px;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between;gap:10px}
.results button:hover{background:var(--surface-2)}
.results span{color:var(--muted);font-size:12px}
.agent{background:var(--surface-2);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px}
.agent-top{display:flex;gap:12px;align-items:center}
.ava{width:42px;height:42px;border-radius:50%;background:var(--btn);color:var(--on-btn);display:grid;place-items:center;font-weight:700;font-family:var(--display);flex:none}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;margin:0;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.rules{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:12px}
.rules b{color:var(--fg);font-weight:600}

.monthnav{display:flex;align-items:center;gap:6px}
.monthnav strong{font-family:var(--display);font-size:16px;min-width:9.5em;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center;padding-block:2px}
.day{aspect-ratio:5/4;min-height:46px;max-width:100%;min-width:0;border:1px solid var(--line);border-radius:10px;background:var(--surface);display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;padding:6px 8px;text-align:left;position:relative;overflow:hidden}
button.day{cursor:pointer}
.day .n{font-weight:700;font-size:14px;line-height:1}
.day .l{font-size:11px;line-height:1.1;white-space:nowrap;color:var(--muted);font-weight:600}
.day.open{background:var(--accent-soft);border-color:transparent} .day.open .l{color:var(--accent-ink)}
.day.full{background:var(--surface-2);border-color:transparent}
.day.soon{background-image:repeating-linear-gradient(135deg,transparent 0 6px,color-mix(in srgb,var(--warn) 22%,transparent) 6px 8px)}
.day.mine{border-style:dashed;border-color:var(--accent)} .day.mine .l{color:var(--accent-ink)}
.day.pend{background-color:var(--warn-soft);border-color:var(--warn)} .day.pend .l{color:var(--warn)}
.day.rej{background-color:var(--danger-soft);border-color:var(--danger)} .day.rej .l{color:var(--danger)}
.day.ok{background:var(--ok-bg);border-color:var(--ok-bg);background-image:none;color:var(--ok-fg)} .day.ok .l{color:var(--ok-fg)}
.day.past{opacity:.42}
.day.sel{background:var(--pick-bg);border-color:var(--pick-bg);background-image:none;color:var(--pick-fg);box-shadow:0 6px 16px -6px var(--pick-bg)} .day.sel .l{color:var(--pick-fg)}
button.day:not(:disabled):hover{border-color:var(--accent)}
.day:disabled{cursor:default}
.day.today .n{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:6px;border:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--surface-2);border-radius:999px;padding:4px 6px 4px 11px;font-size:13px;font-weight:500;display:flex;align-items:center;gap:4px}
.chip button{border:0;background:none;cursor:pointer;color:var(--muted);font-size:15px;line-height:1;padding:2px 5px;border-radius:50%}
.note{font-size:13px;border-radius:10px;padding:8px 11px}
.note.warn{background:var(--warn-soft);color:var(--warn)}
@media (max-width:520px){ .cal{gap:4px} .day{padding:5px;border-radius:8px;aspect-ratio:1/1} .day .l{font-size:10px} .day .n{font-size:13px} .day.ok,.day.pend,.day.rej{padding-inline:2px} .day.ok .n,.day.pend .n,.day.rej .n{padding-left:3px} .day.ok .l,.day.pend .l,.day.rej .l{font-size:9px;letter-spacing:-.02em;align-self:center} }

.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.approved{background:var(--accent-soft);color:var(--accent-ink)}
.pill.rejected{background:var(--danger-soft);color:var(--danger)}
.pill.pending{background:var(--warn-soft);color:var(--warn)}
.pill.skipped{background:var(--surface-2);color:var(--muted)}
.pill.override{background:var(--violet-soft);color:var(--violet)}

.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:760px){ .tiles{grid-template-columns:repeat(2,minmax(0,1fr))} }
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.tile .k{font-size:12px;color:var(--muted);font-weight:600}
.tile .v{font-family:var(--display);font-size:28px;font-weight:700;line-height:1.15}
.tile .s{font-size:12px;color:var(--muted)}
.day.heat{background:color-mix(in srgb,var(--accent) calc(var(--h)*45%),var(--surface))} .day.heat .l{color:var(--fg)}
.day.heat.over{border-color:var(--danger)} .day.heat.over .l{color:var(--danger)}
.chart{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:3px;height:150px;align-items:end;border-bottom:1px solid var(--line)}
.col{position:relative;height:100%;display:flex;align-items:flex-end;min-width:0}
.col .cap{position:absolute;inset:auto 0 0;border:1px dashed var(--line);border-bottom:0;border-radius:4px 4px 0 0}
.col .val{position:relative;width:100%;background:var(--accent);border-radius:4px 4px 0 0}
.col .val.over{background:var(--danger)}
.axis{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:3px;font-size:10px;color:var(--muted);text-align:center}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:left;font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface);position:sticky;top:0}
td{padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td.r,th.r{text-align:right}

.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:minmax(0,1.4fr) 190px minmax(0,1.4fr) minmax(0,1.1fr) minmax(0,1.6fr);gap:6px 14px;align-items:center;padding:11px 4px;border-bottom:1px solid var(--line);font-size:14px}
.row>*{min-width:0} .row .st{display:flex;flex-wrap:wrap;gap:4px}
.rname{border:0;background:none;padding:0;text-align:left;cursor:pointer;font-weight:700;color:var(--accent-ink);display:flex;flex-direction:column}
.rname:hover b{text-decoration:underline}
.rname b{font-weight:700;overflow-wrap:anywhere}
.rname span{font-size:12px;color:var(--muted);font-weight:500}
.rreason{color:var(--muted);font-size:13px}
@media (max-width:820px){ .row{grid-template-columns:minmax(0,1fr) auto} .rreason{grid-column:1/-1} .row .st{justify-content:flex-end} .row .rdate{justify-self:end} }

.sect{display:grid;grid-template-columns:minmax(0,240px) minmax(0,1fr);gap:8px 28px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
.sect>header p{color:var(--muted);font-size:13px;margin-top:4px}
.sect>div{display:flex;flex-direction:column;gap:14px;min-width:0}
@media (max-width:860px){ .sect{grid-template-columns:minmax(0,1fr)} }
.day.aday{aspect-ratio:auto;min-height:0;gap:4px;padding:6px}
.aday input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:4px 2px;text-align:center;font-weight:700;-moz-appearance:textfield;appearance:textfield;min-width:0}
.aday input::-webkit-outer-spin-button,.aday input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.aday.ovr{border-color:var(--violet)} .aday.ovr input{border-color:var(--violet);color:var(--violet)}
.box{border:1px solid var(--line);border-radius:12px;max-height:300px;overflow:auto}
.drop{border:1px dashed var(--accent);background:var(--accent-soft);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.radio{display:flex;gap:6px 18px;flex-wrap:wrap;font-size:14px}
.radio label{display:flex;gap:6px;align-items:center;cursor:pointer}

.overlay{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:radial-gradient(60% 50% at 28% 22%,color-mix(in srgb,var(--accent) 34%,transparent),transparent 70%),radial-gradient(50% 45% at 78% 80%,color-mix(in srgb,var(--violet) 22%,transparent),transparent 70%),var(--overlay);
  -webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);animation:fade .16s ease-out}
.glass{width:min(520px,100%);max-height:100%;overflow:auto;background:var(--glass);border:1px solid var(--glass-line);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:14px;
  -webkit-backdrop-filter:blur(26px) saturate(170%);backdrop-filter:blur(26px) saturate(170%);box-shadow:var(--shadow),inset 0 1px 0 var(--glass-line);animation:pop .2s cubic-bezier(.2,.9,.3,1.2)}
.glass h2{font-size:21px}
.glass .input{background:color-mix(in srgb,var(--surface) 70%,transparent)}
.mhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.x{border:0;background:color-mix(in srgb,var(--fg) 9%,transparent);width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:17px;line-height:1;flex:none}
.sumlist{display:flex;flex-direction:column;gap:2px;margin:0;padding:0;list-style:none}
.sumlist li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:9px 0;border-bottom:1px solid color-mix(in srgb,var(--fg) 10%,transparent)}
.sumlist li small{grid-column:1/-1;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.actions .left{margin-right:auto}
pre.csv{margin:0;background:color-mix(in srgb,var(--surface) 70%,transparent);border-radius:10px;padding:12px;overflow-x:auto;font-size:12px;user-select:all}
.still{animation:none!important}
.glass.mid{width:min(640px,100%)} .glass.wide{width:min(1140px,100%)}
.cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
@media (max-width:860px){ .cols2{grid-template-columns:minmax(0,1fr)} }
.pcard{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.listbox{max-height:400px;overflow:auto}
.panel .sumlist li{border-color:var(--line)}
.tile.ok .v{color:var(--accent-ink)} .tile.no .v{color:var(--danger)} .tile.wait .v{color:var(--warn)}
.dtiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(210px,100%),1fr));gap:12px}
.dtile{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0;transition:transform .15s,border-color .15s,box-shadow .15s}
.dtile:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 10px 24px color-mix(in srgb,var(--accent) 18%,transparent)}
.dtile .mono{width:40px;height:40px;border-radius:11px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--display);font-weight:800;margin-bottom:4px}
.dtile b{font-family:var(--display);font-size:16px}
.dtile .go{color:var(--accent-ink);font-weight:700;font-size:13px;margin-top:4px}
.applybar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:10px;align-items:end;background:color-mix(in srgb,var(--surface) 55%,transparent);border-radius:14px;padding:12px}
@media (max-width:640px){ .applybar{grid-template-columns:minmax(0,1fr)} }
.rcals{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(290px,100%),1fr));gap:20px}
.rcal{display:flex;flex-direction:column;gap:8px;min-width:0}
.rcal .cal{gap:4px} .rcal .day.aday{padding:4px;border-radius:8px;background:color-mix(in srgb,var(--surface) 70%,transparent)}

/* ---- visual refresh ---- */
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:
  radial-gradient(900px 520px at 6% -8%,color-mix(in srgb,var(--accent) 24%,transparent),transparent 62%),

function parseCSV(text){
  var rows = [], row = [], cur = '', q = false, i, c;

  for (i = 0; i < text.length; i++){ c = text[i];
    if (q){ if (c === '"'){ if (text[i + 1] === '"'){ cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === ','){ row.push(cur); cur = ''; }
    else if (c === '\n' || c === '\r'){ if (c === '\r' && text[i + 1] === '\n') i++; push(); }
    else cur += c; }
  push(); return rows;
}

var saved = function(r){ if (!r.error) toast('Saved'); };

  override: function(el){ var D = UI.modal.dept, R = el.dataset.r, s = slotVal(el), eff = baseAlloc(S, D, R, el.dataset.d); if (s === eff) s = null; if (s == null) el.value = eff;
    call('setOverride', {department:D, region:R, date:el.dataset.d, slots:s}).then(saved); },
  rosterFile: function(el){ var f = el.files && el.files[0]; if (!f) return; var fr = new FileReader(), excel = /\.xlsx?$/i.test(f.name);
    if (excel && !window.XLSX){ toast('Excel reading could not load. Save the sheet as CSV and upload that.', true); el.value = ''; return; }
    fr.onload = function(){
      if (!excel){ readRoster(String(fr.result), f.name); return; }
      try { var wb = window.XLSX.read(new Uint8Array(fr.result), {type:'array'}); readRoster(window.XLSX.utils.sheet_to_csv(wb.Sheets[wb.SheetNames[0]]), f.name); }
